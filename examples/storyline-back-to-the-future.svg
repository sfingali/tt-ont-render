<svg xmlns="http://www.w3.org/2000/svg" width="841mm" height="1189mm" viewBox="0 0 841 1189"><title>Storyline — back-to-the-future</title><desc>A reading chart: Marty McFly's experience in 3 chapter(s), consequences local to their events. Technical detail is deliberately absent; see the Topology Atlas.</desc><rect width="841" height="1189.00" fill="#F7F8FA"/><defs><marker id="storyline-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 9 5 L 0 10 Z" fill="#2563EB"/></marker></defs><text x="16.00" y="16.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.994" fill="#172033" font-weight="700">Back To The Future</text><text x="16.00" y="33.39" font-family="Inter, Helvetica, Arial, sans-serif" font-size="4.586" fill="#64748B">Following Marty McFly — read from top to bottom. Dates jump when Marty McFly travels</text><text x="16.00" y="40.04" font-family="Inter, Helvetica, Arial, sans-serif" font-size="4.586" fill="#64748B">through time.</text><line x1="16.00" y1="49.69" x2="825.00" y2="49.69" stroke="#D7DEE8" stroke-width="0.4"/><text x="66.00" y="52.69" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.583" fill="#172033" font-weight="700">1985</text><text x="66.00" y="68.04" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#64748B">01 · the present as first shown · 1985-10-25 to 10-26 (1:16 AM-11:33 PM)</text><line x1="16.00" y1="77.93" x2="825.00" y2="77.93" stroke="#D7DEE8" stroke-width="0.4"/><circle cx="40.00" cy="93.21" r="2.4" fill="#F7F8FA" stroke="#172033" stroke-width="0.7"/><line x1="41.20" y1="93.21" x2="48.60" y2="93.21" stroke="#64748B" stroke-width="0.5"/><text x="18.00" y="94.32" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#64748B" font-weight="600">01</text><text x="66.00" y="91.22" font-family="Inter, Helvetica, Arial, sans-serif" font-size="4.410" fill="#172033" font-weight="600">Marty flees in DeLorean to 1955</text><text x="66.00" y="97.62" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.704" fill="#172033">Marty flees in the time machine and accidentally triggers it, vanishing thirty years into the past.</text><text x="66.00" y="102.99" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#64748B">1985-10-26 01:35</text><rect x="47.00" y="104.74" width="200.00" height="12.88" rx="1.2" fill="#EEF2F7"/><text x="66.00" y="107.59" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#C45514" font-weight="700">HISTORY AT RISK</text><text x="66.00" y="112.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.528" fill="#172033">leads to — 1955 intervention field: Marty arrives 1955 Hill Valley</text><circle cx="40.00" cy="128.70" r="2.4" fill="#F7F8FA" stroke="#172033" stroke-width="0.7"/><line x1="41.20" y1="128.70" x2="48.60" y2="128.70" stroke="#64748B" stroke-width="0.5"/><text x="18.00" y="129.81" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#64748B" font-weight="600">02</text><text x="66.00" y="126.71" font-family="Inter, Helvetica, Arial, sans-serif" font-size="4.410" fill="#172033" font-weight="600">Libyans attack; Doc shot (apparent)</text><text x="66.00" y="133.11" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.704" fill="#172033">The Libyan terrorists Doc stole the plutonium from track him down at the mall and shoot him. (He survives it,</text><text x="66.00" y="138.48" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.704" fill="#172033">thanks to a bulletproof vest.)</text><text x="66.00" y="143.85" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#64748B">1985-10-26 01:16 mall</text><rect x="47.00" y="145.59" width="200.00" height="12.88" rx="1.2" fill="#EEF2F7"/><text x="66.00" y="148.45" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#64748B" font-weight="700">CONSEQUENCE</text><text x="66.00" y="153.06" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.528" fill="#172033">leads to — Marty flees in DeLorean to 1955</text><path d="M 40.00 173.57 L 40.00 183.57" stroke="#2563EB" stroke-width="1.3" fill="none" marker-end="url(#storyline-arrow)"/><text x="66.00" y="173.57" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.704" fill="#2563EB" font-weight="600">TIME JUMP — 1985-10-25 to 10-26 (1:16 AM-11:33 PM) → 1955</text><text x="66.00" y="182.94" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.583" fill="#172033" font-weight="700">1955</text><text x="66.00" y="198.29" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#64748B">02 · a changed history · 1955 intervention field</text><line x1="16.00" y1="208.18" x2="825.00" y2="208.18" stroke="#D7DEE8" stroke-width="0.4"/><text x="66.00" y="221.48" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#64748B" font-weight="600">position in time not encoded (7)</text><text x="66.00" y="230.08" font-family="Inter, Helvetica, Arial, sans-serif" font-size="4.410" fill="#172033" font-weight="600">Marty arrives 1955 Hill Valley</text><text x="66.00" y="236.47" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.704" fill="#172033">Marty crash-lands on a farm outside town. It is November 1955 - thirty years before he was born.</text><text x="66.00" y="241.84" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#64748B">1955-11-05 06:15</text><rect x="47.00" y="243.59" width="200.00" height="12.88" rx="1.2" fill="#EEF2F7"/><text x="66.00" y="246.45" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#64748B" font-weight="700">CONSEQUENCE</text><text x="66.00" y="251.05" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.528" fill="#172033">leads to — Marty interferes with parents' first meeting</text><text x="66.00" y="265.57" font-family="Inter, Helvetica, Arial, sans-serif" font-size="4.410" fill="#172033" font-weight="600">Marty interferes with parents' first meeting</text><text x="66.00" y="271.96" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.704" fill="#172033">Marty gets in the way of the car accident that first brought his parents together - and accidentally becomes</text><text x="66.00" y="277.33" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.704" fill="#172033">the object of his teenage mother's affection.</text><text x="66.00" y="282.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#64748B">1955-11-05 cafe/street</text><rect x="47.00" y="284.45" width="200.00" height="12.88" rx="1.2" fill="#EEF2F7"/><text x="66.00" y="287.31" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#C45514" font-weight="700">HISTORY AT RISK</text><text x="66.00" y="291.91" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.528" fill="#172033">Intervention — Past change threatens Marty existence; fade signal</text><rect x="47.00" y="297.57" width="200.00" height="12.88" rx="1.2" fill="#EEF2F7"/><text x="66.00" y="300.43" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#64748B" font-weight="700">CONSEQUENCE</text><text x="66.00" y="305.03" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.528" fill="#172033">leads to — Photograph / siblings begin to fade</text><text x="66.00" y="319.55" font-family="Inter, Helvetica, Arial, sans-serif" font-size="4.410" fill="#172033" font-weight="600">Photograph / siblings begin to fade</text><text x="66.00" y="325.94" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.704" fill="#172033">In a photograph from home, Marty's brother and sister start to vanish. If his parents never fall in love, he</text><text x="66.00" y="331.31" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.704" fill="#172033">will be next.</text><text x="66.00" y="336.68" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#64748B">1955-11-08 to 11-12</text><rect x="47.00" y="338.43" width="200.00" height="12.88" rx="1.2" fill="#EEF2F7"/><text x="66.00" y="341.29" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#64748B" font-weight="700">CONSEQUENCE</text><text x="66.00" y="345.89" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.528" fill="#172033">leads to — 1955 Doc recruited; clock tower plan</text><text x="66.00" y="360.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="4.410" fill="#172033" font-weight="600">1955 Doc recruited; clock tower plan</text><text x="66.00" y="366.80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.704" fill="#172033">Marty finds the Doc of 1955 and shows him the time machine. The only way home: a lightning bolt due to strike</text><text x="66.00" y="372.17" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.704" fill="#172033">the courthouse clock tower in a week's time.</text><text x="66.00" y="377.54" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#64748B">1955-11-05 lab</text><rect x="47.00" y="379.29" width="200.00" height="12.88" rx="1.2" fill="#EEF2F7"/><text x="66.00" y="382.14" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#64748B" font-weight="700">CONSEQUENCE</text><text x="66.00" y="386.75" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.528" fill="#172033">leads to — Enchantment Under the Sea — George punches Biff, kisses Lorraine</text><text x="66.00" y="401.26" font-family="Inter, Helvetica, Arial, sans-serif" font-size="4.410" fill="#172033" font-weight="600">Enchantment Under the Sea — George punches Biff, kisses Lorraine</text><text x="66.00" y="407.66" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.704" fill="#172033">At the school dance, Marty's father finally stands up to the bully and kisses Marty's mother. Marty's</text><text x="66.00" y="413.03" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.704" fill="#172033">existence is safe again.</text><text x="66.00" y="418.40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#64748B">1955-11-12 21:00 dance</text><rect x="47.00" y="420.15" width="200.00" height="17.99" rx="1.2" fill="#EEF2F7"/><text x="66.00" y="423.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#C45514" font-weight="700">HISTORY AT RISK</text><text x="66.00" y="427.61" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.528" fill="#172033">Intervention — Parents' success rewrites 1985 into improved present; 1985A threat state superseded by</text><text x="66.00" y="432.72" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.528" fill="#172033">1985B</text><rect x="47.00" y="438.38" width="200.00" height="12.88" rx="1.2" fill="#EEF2F7"/><text x="66.00" y="441.24" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#64748B" font-weight="700">CONSEQUENCE</text><text x="66.00" y="445.84" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.528" fill="#172033">leads to — Clock tower lightning sends Marty to 1985</text><rect x="47.00" y="451.50" width="200.00" height="12.88" rx="1.2" fill="#EEF2F7"/><text x="66.00" y="454.36" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#0F766E" font-weight="700">RESTORED</text><text x="66.00" y="458.96" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.528" fill="#172033">intervention — 1985B improved present: Improved 1985B: confident George, humbled Biff</text><text x="66.00" y="473.48" font-family="Inter, Helvetica, Arial, sans-serif" font-size="4.410" fill="#172033" font-weight="600">Clock tower lightning sends Marty to 1985</text><text x="66.00" y="479.87" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.704" fill="#172033">The lightning hits the clock tower right on schedule and powers the time machine. Marty is thrown back to</text><text x="66.00" y="485.24" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.704" fill="#172033">1985.</text><text x="66.00" y="490.61" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#64748B">1955-11-12 22:04</text><rect x="47.00" y="492.36" width="200.00" height="12.88" rx="1.2" fill="#EEF2F7"/><text x="66.00" y="495.22" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#0F766E" font-weight="700">RESTORED</text><text x="66.00" y="499.82" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.528" fill="#172033">leads to — 1985B improved present: Marty warns/saves Doc via letter (bulletproof vest)</text><text x="66.00" y="514.33" font-family="Inter, Helvetica, Arial, sans-serif" font-size="4.410" fill="#172033" font-weight="600">Marty as &quot;Darth Vader&quot; pushes George toward Lorraine</text><text x="66.00" y="520.73" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.704" fill="#172033">Wearing a radiation suit, Marty scares his timid father into asking Lorraine out by pretending to be an alien</text><text x="66.00" y="526.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.704" fill="#172033">called Darth Vader.</text><text x="66.00" y="531.47" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#64748B">1955-11-08 01:21</text><rect x="47.00" y="533.22" width="200.00" height="12.88" rx="1.2" fill="#EEF2F7"/><text x="66.00" y="536.07" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#64748B" font-weight="700">CONSEQUENCE</text><text x="66.00" y="540.68" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.528" fill="#172033">leads to — Enchantment Under the Sea — George punches Biff, kisses Lorraine</text><path d="M 40.00 561.19 L 40.00 571.19" stroke="#2563EB" stroke-width="1.3" fill="none" marker-end="url(#storyline-arrow)"/><text x="66.00" y="561.19" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.704" fill="#2563EB" font-weight="600">TIME JUMP — 1955 intervention field → 1985B improved present</text><text x="66.00" y="570.56" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.583" fill="#172033" font-weight="700">1985B improved present</text><text x="66.00" y="585.91" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#64748B">03 · a changed history</text><line x1="16.00" y1="595.81" x2="825.00" y2="595.81" stroke="#D7DEE8" stroke-width="0.4"/><text x="66.00" y="609.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#64748B" font-weight="600">position in time not encoded (3)</text><text x="66.00" y="617.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="4.410" fill="#172033" font-weight="600">Marty warns/saves Doc via letter (bulletproof vest)</text><text x="66.00" y="624.10" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.704" fill="#172033">Back in 1985, Marty arrives too late to stop the shooting - but Doc taped together the warning letter Marty</text><text x="66.00" y="629.47" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.704" fill="#172033">left him in 1955 and is wearing a bulletproof vest.</text><text x="66.00" y="634.84" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#64748B">1985-10-26 01:24 mall</text><rect x="47.00" y="636.58" width="200.00" height="12.88" rx="1.2" fill="#EEF2F7"/><text x="66.00" y="639.44" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#0F766E" font-weight="700">RESTORED</text><text x="66.00" y="644.04" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.528" fill="#172033">leads to — Improved 1985B: confident George, humbled Biff</text><text x="66.00" y="658.56" font-family="Inter, Helvetica, Arial, sans-serif" font-size="4.410" fill="#172033" font-weight="600">Improved 1985B: confident George, humbled Biff</text><text x="66.00" y="664.95" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.704" fill="#172033">Marty wakes up in a different home: his father is a confident science-fiction author, his mother is happy,</text><text x="66.00" y="670.33" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.704" fill="#172033">and the bully now works for his dad.</text><text x="66.00" y="675.70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#64748B">1985-10-26 10:28</text><rect x="47.00" y="677.44" width="200.00" height="12.88" rx="1.2" fill="#EEF2F7"/><text x="66.00" y="680.30" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#0F766E" font-weight="700">RESTORED</text><text x="66.00" y="684.90" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.528" fill="#172033">leads to — Doc arrives from 2015 — to be continued</text><text x="66.00" y="699.42" font-family="Inter, Helvetica, Arial, sans-serif" font-size="4.410" fill="#172033" font-weight="600">Doc arrives from 2015 — to be continued</text><text x="66.00" y="705.81" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.704" fill="#172033">Doc bursts back from a trip to the future: Marty's kids are in trouble, and the adventure is not over.</text><text x="66.00" y="711.18" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#64748B">1985-10-26 morning (Doc departs for 2015)</text><text x="66.00" y="731.79" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7.056" fill="#172033" font-weight="700">What changed</text><text x="66.00" y="746.25" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#64748B" font-weight="600">original present</text><text x="175.00" y="750.86" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#64748B" font-weight="600">rewritten present</text><text x="66.00" y="760.54" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.528" fill="#172033" font-weight="600">Libyans attack; Doc shot (apparent)</text><text x="175.00" y="765.65" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.528" fill="#0F766E" font-weight="600">Marty warns/saves Doc via letter (bulletproof vest)</text><text x="66.00" y="778.11" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.528" fill="#172033" font-weight="600">Marty flees in DeLorean to 1955</text><text x="175.00" y="783.22" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.528" fill="#0F766E" font-weight="600">Improved 1985B: confident George, humbled Biff</text><text x="66.00" y="795.68" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.528" fill="#172033" font-weight="600">—</text><text x="175.00" y="800.79" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.528" fill="#0F766E" font-weight="600">Doc arrives from 2015 — to be continued</text><line x1="16.00" y1="816.25" x2="825.00" y2="816.25" stroke="#D7DEE8" stroke-width="0.4"/><text x="32.00" y="819.25" font-family="Inter, Helvetica, Arial, sans-serif" font-size="4.939" fill="#172033" font-weight="600">Marty McFly begins in 1985-10-25 to 10-26 (1:16 AM-11:33 PM), moves through 1955 intervention field, and the story ends in 1985B improved present.</text><text x="32.00" y="840.83" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#172033" font-weight="700">How to read this</text><text x="32.00" y="850.20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#64748B">thin line — the next thing that happens · blue arrow — a jump through time · orange — history at risk · teal — restored</text><text x="32.00" y="859.88" font-family="Inter, Helvetica, Arial, sans-serif" font-size="3.175" fill="#64748B">Sources, every encoded relationship, coverage and audit: see the Topology Atlas rendering.</text></svg>